name: Build OTA 1.1.4 test firmware

on:
  push:
    branches:
      - test/ota-1.1.4-apple-folders
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/ota-1.1.4-apple-folders
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and dependencies
        run: |
          pip install -U platformio
          pip install -r requirements.txt

      - name: Verify OTA partition layout
        run: |
          grep -q 'app0,     app,  ota_0,   0x10000, 0x640000' partitions.csv
          grep -q 'app1,     app,  ota_1,   0x650000,0x640000' partitions.csv

      - name: Build OTA target 1.1.4
        shell: bash
        run: |
          mkdir -p dist
          set -o pipefail
          pio run -e ota-target 2>&1 | tee dist/ota-target-build.log

      - name: Report compiler failure to test PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f dist/ota-target-build.log ]; then
            {
              echo '### OTA 1.1.4 CI compiler tail'
              echo
              echo '```text'
              tail -n 180 dist/ota-target-build.log
              echo '```'
            } > dist/failure-comment.md
            gh pr comment 9 --repo "${{ github.repository }}" --body-file dist/failure-comment.md
          fi

      - name: Stage OTA release asset
        run: |
          cp .pio/build/ota-target/firmware.bin dist/firmware-release.bin
          sha256sum dist/firmware-release.bin

      - name: Publish controlled OTA target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v1.1.4.1'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/firmware-release.bin --clobber
          else
            gh release create "$TAG" dist/firmware-release.bin \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --prerelease \
              --title 'inkMOD 1.1.4 OTA test target' \
              --notes 'Controlled OTA target for test/ota-1.1.4-apple-folders. Visible firmware version remains 1.1.4; private OTA comparison revision is 1.1.4.1.'
          fi

      - name: Verify release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases/tags/v1.1.4.1 > dist/release.json
          grep -q '"tag_name":"v1.1.4.1"' dist/release.json
          grep -q '"name":"firmware-release.bin"' dist/release.json

      - name: Build OTA bootstrap 1.1.4
        run: pio run -e ota-bootstrap

      - name: Stage bootstrap artifact
        run: |
          cp .pio/build/ota-bootstrap/firmware.bin dist/inkMOD-1.1.4-OTA-bootstrap.bin
          sha256sum dist/inkMOD-1.1.4-OTA-bootstrap.bin

      - name: Upload OTA test pair
        uses: actions/upload-artifact@v4
        with:
          name: inkMOD-1.1.4-OTA-X4-apple-folder-fix
          path: |
            dist/inkMOD-1.1.4-OTA-bootstrap.bin
            dist/firmware-release.bin
            dist/release.json
          if-no-files-found: error
