name: Firmware CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-tiny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
          pip install -r requirements.txt

      - name: Validate release metadata
        run: python scripts/release_check.py

      - name: Build developer firmware
        run: pio run -e developer

      - name: Build release firmware
        run: pio run -e release

      - name: Build X3 display diagnostic firmware
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 14
        run: pio run -e x3diag

      - name: Prepare X3 diagnostic artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 14
        run: |
          mkdir -p x3diag-artifact
          cp .pio/build/x3diag/firmware-release.bin x3diag-artifact/inkMOD-X3-display-diagnostic.bin
          sha256sum x3diag-artifact/*.bin > x3diag-artifact/SHA256SUMS.txt
          cat > x3diag-artifact/README.txt <<'EOF'
          inkMOD X3 display diagnostic

          After flashing and booting with an SD card inserted, the firmware writes:
            /x3-display-report.txt

          It intentionally does not initialize the normal display/UI driver.
          Remove the SD card after 10-15 seconds and send x3-display-report.txt back for analysis.
          Restore a normal firmware afterwards.
          EOF

      - name: Upload X3 diagnostic artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 14
        uses: actions/upload-artifact@v4
        with:
          name: inkMOD-X3-display-diagnostic
          path: x3diag-artifact/
          if-no-files-found: error
