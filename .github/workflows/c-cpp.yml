name: Firmware CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-tiny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
          pip install -r requirements.txt

      - name: Validate release metadata
        run: python scripts/release_check.py

      - name: Build developer firmware
        run: pio run -e developer

      - name: Build release firmware
        run: pio run -e release

      - name: Upload X3 test release binary
        uses: actions/upload-artifact@v4
        with:
          name: inkmod-x3-test-bin
          path: .pio/build/release/firmware.bin
          if-no-files-found: error
