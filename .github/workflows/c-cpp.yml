name: Firmware CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-tiny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
          pip install -r requirements.txt

      - name: Validate release metadata
        run: python scripts/release_check.py

      - name: Build developer firmware
        run: pio run -e developer

      - name: Build release firmware
        run: pio run -e release

      - name: Prepare X3 CrossPoint test BIN
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 15
        run: |
          cp .pio/build/release/firmware-release.bin inkMOD-1.1.5-X3-CrossPoint-1.5.0-test.bin
          sha256sum inkMOD-1.1.5-X3-CrossPoint-1.5.0-test.bin > SHA256SUMS.txt

      - name: Upload X3 CrossPoint test BIN
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 15
        uses: actions/upload-artifact@v4
        with:
          name: inkMOD-X3-CrossPoint-1.5.0-test
          path: |
            inkMOD-1.1.5-X3-CrossPoint-1.5.0-test.bin
            SHA256SUMS.txt
          if-no-files-found: error
