name: Firmware CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
          pip install -r requirements.txt

      - name: Validate release metadata
        run: python scripts/release_check.py

      - name: Build X3/X4 developer firmware
        run: pio run -e x3x4-developer

      - name: Build X3/X4 release firmware
        run: pio run -e x3x4-release

      - name: Build X4 Pro developer firmware
        run: pio run -e x4pro-developer

      - name: Build X4 Pro release firmware
        run: pio run -e x4pro-release

      - name: Build X4 Classic developer firmware
        run: pio run -e x4classic-developer

      - name: Build X4 Classic release firmware
        run: pio run -e x4classic-release


      - name: Upload X3/X4 test firmware
        uses: actions/upload-artifact@v4
        with:
          name: x3x4-test-firmware
          path: .pio/build/x3x4-release/*.bin
          if-no-files-found: error
          retention-days: 7

      - name: Upload X4 Pro test firmware
        uses: actions/upload-artifact@v4
        with:
          name: x4pro-test-firmware
          path: .pio/build/x4pro-release/*.bin
          if-no-files-found: error
          retention-days: 7

      - name: Upload X4 Classic test firmware
        uses: actions/upload-artifact@v4
        with:
          name: x4classic-test-firmware
          path: .pio/build/x4classic-release/*.bin
          if-no-files-found: error
          retention-days: 7
