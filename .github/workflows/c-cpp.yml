name: Firmware CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-tiny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
          pip install -r requirements.txt

      - name: Validate release metadata
        run: python scripts/release_check.py

      - name: Build developer firmware
        run: pio run -e developer

      - name: Build release firmware
        run: pio run -e release

      - name: Prepare KOReader hotfix test binary
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 13
        run: |
          mkdir -p koreader-hotfix
          cp .pio/build/release/firmware-release.bin koreader-hotfix/firmware-release-v1.1.5-koreader-hotfix.bin
          sha256sum koreader-hotfix/*.bin > koreader-hotfix/SHA256SUMS.txt

      - name: Upload KOReader hotfix test binary
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 13
        uses: actions/upload-artifact@v4
        with:
          name: inkMOD-1.1.5-koreader-wolfssl-test
          path: koreader-hotfix/
          if-no-files-found: error
