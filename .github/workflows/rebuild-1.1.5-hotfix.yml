name: Rebuild 1.1.5 hotfix asset

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/rebuild-1.1.5-hotfix.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
          pip install -r requirements.txt

      - name: Validate 1.1.5 metadata
        run: python scripts/release_check.py

      - name: Build production release
        run: pio run -e release

      - name: Prepare release asset
        run: |
          set -euo pipefail
          cp .pio/build/release/firmware-release.bin firmware-release-v1.1.5.bin
          sha256sum firmware-release-v1.1.5.bin | tee firmware-release-v1.1.5.sha256

      - name: Replace v1.1.5 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.1.5 firmware-release-v1.1.5.bin --clobber --repo "${{ github.repository }}"

      - name: Verify uploaded asset byte-for-byte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-check
          gh release download v1.1.5 --repo "${{ github.repository }}" --pattern firmware-release-v1.1.5.bin --dir /tmp/release-check --clobber
          test "$(sha256sum firmware-release-v1.1.5.bin | awk '{print $1}')" = "$(sha256sum /tmp/release-check/firmware-release-v1.1.5.bin | awk '{print $1}')"
          echo "Verified release SHA-256: $(sha256sum /tmp/release-check/firmware-release-v1.1.5.bin | awk '{print $1}')" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkMOD-1.1.5-final-hotfix
          path: |
            firmware-release-v1.1.5.bin
            firmware-release-v1.1.5.sha256
          if-no-files-found: error
