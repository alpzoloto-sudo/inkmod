name: Rebuild inkMOD 1.1.5 classic reader

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rebuild-115-classic-reader.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: rebuild-inkmod-1.1.5-classic-reader
  cancel-in-progress: true

jobs:
  rebuild-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tree
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and dependencies
        run: |
          pip install -U platformio
          pip install -r requirements.txt

      - name: Validate 1.1.5 metadata
        run: |
          grep -qx 'version = 1.1.5' platformio.ini
          grep -qx 'inkmod_version = 1.1.5' platformio.ini
          python scripts/release_check.py

      - name: Build production 1.1.5 firmware
        env:
          INKMOD_RELEASE_VERSION: 1.1.5
        run: pio run -e release

      - name: Verify release asset
        id: asset
        run: |
          FILE='.pio/build/release/firmware-release-v1.1.5.bin'
          test -s "$FILE"
          ls -lh "$FILE"
          SHA=$(sha256sum "$FILE" | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256=$SHA"

      - name: Replace v1.1.5 firmware asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE='.pio/build/release/firmware-release-v1.1.5.bin'
          gh release view v1.1.5 --repo "${{ github.repository }}"
          gh release upload v1.1.5 "$FILE" --clobber --repo "${{ github.repository }}"
          echo 'Re-uploaded firmware-release-v1.1.5.bin'

      - name: Report successful rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_SHA: ${{ steps.asset.outputs.sha }}
        run: |
          gh pr comment 10 --repo "${{ github.repository }}" --body "RELEASE_115_CLASSIC_OK commit=${GITHUB_SHA} asset=firmware-release-v1.1.5.bin sha256=${ASSET_SHA}"
