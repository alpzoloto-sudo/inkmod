name: Build and publish release firmware

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
    paths:
      - ".github/release-version.txt"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build/publish (e.g. 1.1.8, no leading "v")'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and build dependencies
        run: |
          pip install -U platformio
          pip install -r requirements.txt

      - name: Derive version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < .github/release-version.txt)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Version must be numeric, for example 1.1.8"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Embed release version in firmware
        run: |
          sed -i -E 's/^version = .*/version = ${{ steps.version.outputs.version }}/' platformio.ini
          sed -i -E 's/^inkmod_version = .*/inkmod_version = ${{ steps.version.outputs.version }}/' platformio.ini

      - name: Validate release tree
        run: python scripts/release_check.py

      - name: Build X3/X4 release firmware
        env:
          INKMOD_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pio run -e x3x4-release

      - name: Build X4 Pro release firmware
        env:
          INKMOD_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pio run -e x4pro-release

      - name: Build X4 Classic release firmware
        env:
          INKMOD_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pio run -e x4classic-release

      - name: Prepare release assets
        id: artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          X3X4=".pio/build/x3x4-release/firmware-x3x4-v${VERSION}.bin"
          X4PRO=".pio/build/x4pro-release/firmware-x4pro-v${VERSION}.bin"
          X4CLASSIC=".pio/build/x4classic-release/firmware-x4classic-v${VERSION}.bin"
          for FILE in "$X3X4" "$X4PRO" "$X4CLASSIC"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Expected artifact not found: $FILE"
              exit 1
            fi
          done

          # Compatibility bridge: firmware already installed from older releases
          # searches GitHub for firmware-release*.bin. Keep this alias pointing to
          # the C3 X3/X4 image so those devices can OTA-update into the new naming.
          LEGACY=".pio/build/x3x4-release/firmware-release-v${VERSION}.bin"
          cp "$X3X4" "$LEGACY"

          echo "x3x4=$X3X4" >> "$GITHUB_OUTPUT"
          echo "x4pro=$X4PRO" >> "$GITHUB_OUTPUT"
          echo "x4classic=$X4CLASSIC" >> "$GITHUB_OUTPUT"
          echo "legacy=$LEGACY" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "inkMOD v${{ steps.version.outputs.version }}"
          generate_release_notes: false
          body_path: ".github/release-notes/v${{ steps.version.outputs.version }}.md"
          files: |
            ${{ steps.artifacts.outputs.x3x4 }}
            ${{ steps.artifacts.outputs.x4pro }}
            ${{ steps.artifacts.outputs.x4classic }}
            ${{ steps.artifacts.outputs.legacy }}
