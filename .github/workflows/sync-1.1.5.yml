name: One-shot sync inkMOD 1.1.5

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-release-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0
          ref: main

      - name: Checkout verified 1.1.5 source tree
        uses: actions/checkout@v4
        with:
          repository: alpzoloto-sudo/inkmod-optimized
          ref: 63f366af561f3d423bd4935bccc712d9640eb81c
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Copy verified tree into release branch
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' source/ target/
          rm -f target/.github/workflows/sync-1.1.5.yml

          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C release/1.1.5
          git add -A
          git commit -m "Prepare inkMOD 1.1.5 release tree"
          git push --force origin HEAD:refs/heads/release/1.1.5
