name: Vendor pinned FreeInk Xteink drivers

on:
  push:
    branches: [ "hotfix/1.1.5-book-freeze" ]

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.1.5-book-freeze
          fetch-depth: 0

      - name: Vendor tested FreeInk display stack
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=ffeaaa271231d865590f8c54ea45ec02b1342d4e
          rm -rf /tmp/freeink-sdk
          git init /tmp/freeink-sdk
          git -C /tmp/freeink-sdk remote add origin https://github.com/Free-Ink/freeink-sdk.git
          git -C /tmp/freeink-sdk fetch --depth 1 origin "$COMMIT"
          git -C /tmp/freeink-sdk checkout --detach FETCH_HEAD

          SRC=/tmp/freeink-sdk/libs/display/FreeInkDisplay/src
          DST=freeink-sdk/libs/display/FreeInkDisplay/src
          files=(
            driver/PanelDriver.h
            driver/Ssd1677Driver.cpp driver/Ssd1677Driver.h
            driver/Uc8179Driver.cpp driver/Uc8179Driver.h
            driver/Uc8253X3Driver.cpp driver/Uc8253X3Driver.h
            driver/Uc8279Driver.cpp driver/Uc8279Driver.h
            driver/Uc8279X4Driver.cpp driver/Uc8279X4Driver.h
            bus/EpdBus.cpp bus/EpdBus.h
          )
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$DST/$f")"
            cp "$SRC/$f" "$DST/$f"
          done

          cat > scripts/disable_live_display_probe.py <<'PY'
#!/usr/bin/env python3
from pathlib import Path

Import("env")  # type: ignore[name-defined]  # PlatformIO/SCons
ROOT = Path(env["PROJECT_DIR"])  # type: ignore[name-defined]
HAL_DISPLAY_CPP = ROOT / "lib/hal/HalDisplay.cpp"

# 1.1.5 hotfix: use the vendored, field-tested FreeInk display stack from
# ffeaaa271231d865590f8c54ea45ec02b1342d4e, but do NOT live-probe the EPD
# controller at boot. Keep X3/X4 family detection and select the panel
# controller conservatively from the factory hw_calib/screenType value.
text = HAL_DISPLAY_CPP.read_text(encoding="utf-8")
text = text.replace("#include <XteinkDetect.h>\n", "")

live = '''  // Live display-bus fingerprint is the ground truth for panel revision.\n  // It promotes stock X4 SSD1677 -> UC8179/UC8279 or X3 UC8253 -> UC8279\n  // only after two-pass confirmation; otherwise the stock profile remains.\n  // Do not let OEM NVS override this decision: full-chip images can carry\n  // calibration from another unit, while the live controller is authoritative.\n  freeink::applyXteinkDisplayController();\n\n  einkDisplay.begin();\n'''

safe = '''  // Safe revision selection from factory calibration only. Unknown/missing data\n  // leaves the stock controller untouched and boot continues normally.\n  applyOemNvsDisplayController(isX3);\n\n  einkDisplay.begin();\n'''

if live in text:
    text = text.replace(live, safe, 1)
elif safe not in text:
    raise SystemExit("HalDisplay.cpp: expected live-probe or safe NVS block not found")

HAL_DISPLAY_CPP.write_text(text, encoding="utf-8")
print("Pinned FreeInk drivers are vendored; live display probe disabled")
PY

          printf '%s\n' "$COMMIT" > freeink-sdk/INKMOD_XTEINK_DRIVER_PIN
          rm -f .github/workflows/vendor-freeink-hotfix.yml

      - name: Commit vendored driver stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "hotfix: vendor tested FreeInk Xteink drivers"
          git push origin HEAD:hotfix/1.1.5-book-freeze
