name: Port KOReader wolfSSL hotfix

on:
  push:
    branches: [ "hotfix/1.1.5-koreader-wolfssl" ]
    paths:
      - ".github/workflows/vendor-koreader-wolfssl-hotfix.yml"

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.1.5-koreader-wolfssl
          fetch-depth: 0

      - name: Port tested CrossInk KOReader TLS stack
        shell: bash
        run: |
          set -euo pipefail
          REF=v1.5.1-rc-3
          BASE="https://raw.githubusercontent.com/uxjulia/CrossInk/${REF}"

          curl -fsSL "$BASE/lib/KOReaderSync/KOReaderSyncClient.cpp" -o lib/KOReaderSync/KOReaderSyncClient.cpp
          curl -fsSL "$BASE/lib/KOReaderSync/KOReaderSyncClient.h" -o lib/KOReaderSync/KOReaderSyncClient.h
          sed -i 's/crossink-device/inkmod-device/g' lib/KOReaderSync/KOReaderSyncClient.cpp
          curl -fsSL "$BASE/scripts/patch_wolfssl.py" -o scripts/patch_wolfssl.py

          python - <<'PY'
          from pathlib import Path
          p = Path('platformio.ini')
          s = p.read_text()

          flags_anchor = '  -DPNG_MAX_BUFFERED_PIXELS=16416\n'
          wolf_flags = '''  -DFREEINK_NET_WOLFSSL=1
          -DWOLFSSL_USER_SETTINGS
          -DWOLFSSL_OPTIONS_H
          -DWOLFSSL_CLIENT_EXAMPLE
          -DWOLFSSL_TLS13
          -DWOLFSSL_HAVE_SP_ECC
          -DWOLFSSL_SP_SMALL
          -DHAVE_FFDHE_2048
          -DHAVE_CURVE25519
          -DHAVE_SNI
          '''
          if '-DFREEINK_NET_WOLFSSL=1' not in s:
              if flags_anchor not in s:
                  raise SystemExit('build flags anchor not found')
              s = s.replace(flags_anchor, flags_anchor + wolf_flags, 1)

          script_anchor = '  pre:scripts/build_web.py\n'
          if 'pre:scripts/patch_wolfssl.py' not in s:
              if script_anchor not in s:
                  raise SystemExit('extra_scripts anchor not found')
              s = s.replace(script_anchor, '  pre:scripts/patch_wolfssl.py\n' + script_anchor, 1)

          deps_anchor = '  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager\n'
          deps = '''  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
          '''
          if 'SecureNet=symlink://freeink-sdk/libs/network/SecureNet' not in s:
              if deps_anchor not in s:
                  raise SystemExit('lib_deps anchor not found')
              s = s.replace(deps_anchor, deps_anchor + deps, 1)

          ws_anchor = '  links2004/WebSockets @ 2.7.3\n'
          if 'wolfssl/Arduino-wolfSSL @ 5.7.2' not in s:
              if ws_anchor not in s:
                  raise SystemExit('wolfssl dependency anchor not found')
              s = s.replace(ws_anchor, ws_anchor + '  wolfssl/Arduino-wolfSSL @ 5.7.2\n', 1)

          p.write_text(s)
          PY

          rm .github/workflows/vendor-koreader-wolfssl-hotfix.yml

      - name: Commit port
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "hotfix(koreader): use CrossInk wolfSSL TLS stack"
          git push origin HEAD:hotfix/1.1.5-koreader-wolfssl
