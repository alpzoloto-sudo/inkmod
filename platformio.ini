[platformio]
default_envs = x3x4-release
extra_configs = platformio.local.ini

[inkmod]
version = 1.1.10
inkmod_version = 1.1.10

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=8192
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_SP_SMALL
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions
  -O2
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

build_unflags =
  -std=gnu++11
  -fexceptions
  -Og

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_web.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_feedback_fixes.py
  pre:scripts/patch_fb2_cover_order.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/patch_websockets.py
  post:scripts/rename_firmware.py
  post:scripts/check_firmware_size.py

# Reader fonts are supplied as prebuilt .cpfont files on the SD card; the
# online font manager is intentionally excluded from this firmware.
src_filter =
  +<*>
  -<activities/settings/FontDownloadActivity.cpp>

lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  UsbMassStorage=symlink://freeink-sdk/libs/hardware/UsbMassStorage
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2

lib_ignore =
  HalClockSim

[env:x3x4-developer]
extends = base
custom_artifact_variant = x3x4
build_flags =
  ${base.build_flags}
  -DINKMOD_VERSION=\"${inkmod.inkmod_version}\"
  -DINKMOD_FIRMWARE_VARIANT=\"x3x4\"
  -DWOLFSSL_SHA384
  -DWOLFSSL_SHA512
  -DUSE_NEW_READER=0
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DOMIT_TEENSY_FONT
  -DOMIT_ITTY_BITTY_FONT
  -DOMIT_TINY_FONT
  -DOMIT_SMALL_FONT
  -DOMIT_MEDIUM_FONT
  -DOMIT_LARGE_FONT
  -DOMIT_XLARGE_FONT
  -DOMIT_HUGE_FONT

[env:x3x4-release]
extends = base
custom_artifact_variant = x3x4
build_flags =
  ${base.build_flags}
  -DINKMOD_VERSION=\"${inkmod.version}\"
  -DINKMOD_FIRMWARE_VARIANT=\"x3x4\"
  -DWOLFSSL_SHA384
  -DWOLFSSL_SHA512
  -DUSE_NEW_READER=0
  -DLOG_LEVEL=-1
  -DNDEBUG
  -DOMIT_TEENSY_FONT
  -DOMIT_ITTY_BITTY_FONT
  -DOMIT_TINY_FONT
  -DOMIT_SMALL_FONT
  -DOMIT_MEDIUM_FONT
  -DOMIT_LARGE_FONT
  -DOMIT_XLARGE_FONT
  -DOMIT_HUGE_FONT

; --- XTEINK X4 Pro — ESP32-S3, 16MB flash / 8MB PSRAM -------------------------
[env:x4pro-developer]
extends = base
custom_artifact_variant = x4pro
board = esp32-s3-devkitc1-n16r8
board_upload.maximum_size = 16777216
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -UFREEINK_DEVICE_X4
  -UFREEINK_DEVICE_X3
  -DFREEINK_DEVICE_X4PRO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"inkMOD_X4_Pro\"
  -DUSB_MANUFACTURER=\"inkMOD\"
  -DINKMOD_VERSION=\"${inkmod.inkmod_version}\"
  -DINKMOD_FIRMWARE_VARIANT=\"x4pro\"
  -DUSE_NEW_READER=0
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:x4pro-release]
extends = base
custom_artifact_variant = x4pro
board = esp32-s3-devkitc1-n16r8
board_upload.maximum_size = 16777216
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -UFREEINK_DEVICE_X4
  -UFREEINK_DEVICE_X3
  -DFREEINK_DEVICE_X4PRO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"inkMOD_X4_Pro\"
  -DUSB_MANUFACTURER=\"inkMOD\"
  -DINKMOD_VERSION=\"${inkmod.version}\"
  -DINKMOD_FIRMWARE_VARIANT=\"x4pro\"
  -DUSE_NEW_READER=0
  -DLOG_LEVEL=-1
  -DNDEBUG
  -DUSE_BLOCK_DEVICE_INTERFACE=1


; --- XTEINK X4 Classic — ESP32-S3, 16MB flash / 8MB PSRAM ---------------------
