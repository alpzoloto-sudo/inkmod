<div class="card">
      <h2 data-i18n="home.title">Device Status</h2>
      <div class="info-row">
        <span class="label" data-i18n="home.version">Version</span>
        <span class="value" id="version"></span>
      </div>
      <div class="info-row">
        <span class="label" data-i18n="home.wifi_status">WiFi Status</span>
        <span class="status" data-i18n="home.wifi_connected">Connected</span>
      </div>
      <div class="info-row">
        <span class="label" data-i18n="home.ip">IP Address</span>
        <span class="value" id="ip-address"></span>
      </div>
      <div class="info-row">
        <span class="label" data-i18n="home.free_memory">Free Memory</span>
        <span class="value" id="free-heap"></span>
      </div>
    </div>
